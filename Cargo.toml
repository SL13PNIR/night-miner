[package]
name = "night-miner"
version = "0.1.0"
edition = "2021"
authors = ["NIGHT Miner"]
description = "Optimized miner for NIGHT token Scavenger Mine program"

[dependencies]
# AshMaize library from official GitHub repository
ashmaize = { git = "https://github.com/input-output-hk/ce-ashmaize", branch = "master" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Hex encoding
hex = "0.4"

# Cardano libraries
cardano-serialization-lib = "12.0"
bech32 = "0.11"

# Crossbeam for efficient multi-threading
crossbeam = "0.8"
num_cpus = "1.16"

# Progress indicators
indicatif = "0.17"

# Configuration
config = "0.14"
toml = "0.8"

[dev-dependencies]
mockito = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
