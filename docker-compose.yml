version: '3.8'

services:
  night-miner:
    build: .
    container_name: night-miner
    restart: unless-stopped
    
    # CPU configuration - adjust threads based on your system
    command: ["auto-mine", "--threads", "2"]
    
    # Volume for persistent wallet storage
    volumes:
      - ./auto-mine-wallet:/app/auto-mine-wallet
    
    # Optional: Limit CPU usage to avoid impacting other services
    # Uncomment and adjust as needed
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'      # Limit to 2 CPU cores
    #       memory: 2G       # Limit to 2GB RAM
    
    # Network mode
    network_mode: bridge
    
    # Environment variables (optional)
    # environment:
    #   - RUST_LOG=info
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
